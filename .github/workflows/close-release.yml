name: Close release

# Closes a release on a manual run: reads the version from package.json, pushes the
# Node Admin image to Docker Hub as `latest` and `<version>` (plus any extra tags you
# enter), builds the desktop app for macOS, Windows and Linux, then creates the GitHub
# release `<version>` on the commit, with that version's CHANGELOG.md section as its
# notes and the desktop installers and update files (latest*.yml) as its assets. The
# installed desktop apps update themselves from these releases. The run fails before
# building if that git tag already exists.
# Pull requests only build the image and the Linux desktop app to check that they still
# build. Nothing is pushed or released.
#
# Required repository settings (Settings > Secrets and variables > Actions):
#   - variable DOCKERHUB_USERNAME: Docker Hub account or organisation that owns the image
#                                   (falls back to the GitHub owner name when unset)
#   - secret   DOCKERHUB_TOKEN:    Docker Hub access token with Read & Write scope
#
# Optional, to sign and notarize the macOS app (without them it is unsigned and cannot
# install updates itself, it links to the release instead). Set all five or none:
#   - secret   CSC_LINK:                    Developer ID Application certificate, base64 encoded .p12
#   - secret   CSC_KEY_PASSWORD:            password of that .p12
#   - secret   APPLE_ID:                    Apple ID of the developer account
#   - secret   APPLE_APP_SPECIFIC_PASSWORD: app-specific password of that Apple ID
#   - secret   APPLE_TEAM_ID:               team ID of the developer account

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Extra image tags (optional), separated by commas or spaces. "latest" and the package.json version are always added.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'close-release' || format('docker-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
  IMAGE: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/hopr-node-admin-ui
  PUSH: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::package.json version '$version' is not a valid Docker tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag is free
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" 2>&1); then
            echo "::error::Tag $VERSION already exists. Bump version in package.json."
            exit 1
          elif ! grep -q 'HTTP 404' <<< "$out"; then
            echo "::error::Could not check tag $VERSION: $out"
            exit 1
          fi

  docker:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Parse requested tags
        id: tags
        if: env.PUSH == 'true'
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -f # no filename expansion when splitting the input
          seen=" latest $VERSION "
          list="type=raw,value=latest"$'\n'"type=raw,value=${VERSION}"$'\n'
          for tag in $(echo "$INPUT_TAGS" | tr ',' ' '); do
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid Docker tag: '$tag'"
              exit 1
            fi
            [[ "$seen" == *" $tag "* ]] && continue
            seen+="$tag "
            list+="type=raw,value=${tag}"$'\n'
          done
          {
            echo 'list<<EOF'
            printf '%s' "$list"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ steps.tags.outputs.list || 'type=ref,event=pr' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # electron-builder.yml picks the targets: dmg + zip (arm64, x64), NSIS (x64), AppImage (x64, arm64)
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["macos-latest", "windows-latest", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenjp2-tools

      - name: Build the app
        run: |
          pnpm build
          pnpm electron:compile

      - name: Package for macOS
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=()
          if [ -n "$CSC_LINK" ]; then
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::error::CSC_LINK is set, so APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are needed to notarize"
              exit 1
            fi
            # the app installs its own updates only when it is signed, see electron/updater.ts
            args+=(--config.extraMetadata.desktop.macSigned=true)
          else
            echo "::warning::No macOS signing certificate, the macOS app is unsigned"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm exec electron-builder --mac --publish never "${args[@]}"

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --publish never

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux --publish never

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, docker, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
        run: |
          # the "## <version>" section up to the next heading, without surrounding blank lines
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
              last = n; while (last >= first && lines[last] ~ /^[[:space:]]*$/) last--
              for (i = first; i <= last; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md
          # the desktop apps of stable versions only look at stable releases, so prereleases must stay marked
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${prerelease[@]}" \
            release-assets/*
          {
            echo "### Released $VERSION"
            echo
            echo "Released \`$GITHUB_SHA\` as \`$VERSION\` and pushed:"
            echo
            while read -r tag; do [ -n "$tag" ] && echo "- \`$tag\`"; done <<< "$IMAGE_TAGS"
            echo
            echo "Desktop assets:"
            echo
            for file in release-assets/*; do echo "- \`$(basename "$file")\`"; done
            echo
            if [ -s release-notes.md ]; then
              echo "Release notes taken from CHANGELOG.md."
            else
              echo "No CHANGELOG.md section for $VERSION, the release has no notes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
