server {
  listen      4677;
  listen      [::]:4677;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Content-hashed build output (e.g. index-B1a2c3D4.js) never changes, so cache it for a long time.
  # Unhashed files copied from public/assets fall through to the default rule below.
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single page app: unknown paths fall back to index.html, which is never cached
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
