server {
  listen      4677;
  listen      [::]:4677;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Content-hashed build output (e.g. index-B1a2c3D4.js) never changes, so cache it for a long time.
  # Unhashed files copied from public/assets fall through to the default rule below.
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The hoprd image registry has no CORS, so the app reads its tags through here.
  # Resolved per request, so a container started offline still serves the app.
  location = /hoprd-tags {
    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $registry europe-west3-docker.pkg.dev;
    proxy_pass https://$registry/v2/hoprassociation/docker-images/hoprd/tags/list;
    proxy_set_header Host $registry;
    proxy_ssl_server_name on;
    add_header Cache-Control "no-cache";
  }

  # Single page app: unknown paths fall back to index.html, which is never cached
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
